<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio - Jiuugo</title>
    <link rel="stylesheet" href="../css/styles.css">

<body>

                <div id="description"></div>

            <a href="proyectos.html" class="opcionNavbar" id="navbar2"></a>
            <button id="cambiarTraduccion2" class="opcionNavbar"></button>
        </nav>
    </header>

    <section class="contenidoPrincipal oculto contenedorProyectos" id="contenedorProyectos">

        <a href="proyectoMemorion.html" class="enlace-tarjeta">
            <div class="cajaApartado">
                <img src="../img/img proyectos/memorion.png" alt="Logo de Memorion">
                <h2 id="memorion"></h2>
                <p id="peqDescMemorion"></p>
                <h3 id="titleTecnologiasMemorion"></h3>
                <ul>
                    <li id="tecnologia1Memorion"></li>
                    <li id="tecnologia2Memorion"></li>
                    <li id="tecnologia3Memorion"></li>
                </ul>

        </a>

        <a href="proyectoCalcuRedes.html" class="enlace-tarjeta">

                <img src="../img/img proyectos/mapis.png" alt="Logo de Mapis">
                <h2 id="mapis">Mapis</h2>
                <p id="peqDescMapis"></p>
                <h3 id="titleTecnologiasMapis"></h3>

    <footer class="footer">
        <div class="footer-content">
            <span id="footerCopyright"></span>
            <span class="footer-links">
                <a href="https://github.com/jiuugo" target="_blank" rel="noopener" aria-label="GitHub">
                    <img src="../img/icons/github/github-mark-white.png" alt="GitHub" class="footer-icon">
                </a>
                <a href="https://www.linkedin.com/in/hugosuarezzz/" target="_blank" rel="noopener" aria-label="LinkedIn">
                    <img src="../img/icons/linkedin/InBug-White.png" alt="LinkedIn" class="footer-icon">
